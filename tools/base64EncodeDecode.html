<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base64 Encoder / Decoder</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --primary: #2563eb;
            --danger: #dc2626;
            --border: #d1d5db;
            --text: #111827;
            --muted: #6b7280;
        }

        body {
            margin: 0;
            padding: 40px;
            background: var(--bg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr 0.8fr;
            gap: 30px;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
            color: var(--primary);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            margin-top: 16px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 13px;
            cursor: pointer;
        }

        button.danger {
            background: var(--danger);
        }

        button.secondary {
            background: #374151;
        }

        button.small {
            font-size: 11px;
            padding: 5px 8px;
            margin-left: 5px;
        }

        #preview img {
            max-width: 100%;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .cache-item {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }

        .cache-item:last-child {
            border-bottom: none;
        }

        .cache-meta {
            font-size: 11px;
            color: var(--muted);
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Base64 File Encoder / Decoder</h1>

<div class="container">

    <!-- ENCODE -->
    <div class="card">
        <h2>Encode</h2>
        <div id="dropZone" class="drop-zone">
            Drag & drop a file<br>
            <small>(jpg, png, webp, pdf)</small>
        </div>
        <input type="file" id="fileInput" hidden accept=".jpg,.jpeg,.png,.webp,.pdf">
        <textarea id="base64Output" placeholder="Base64 Data URL..."></textarea>
        <button id="copyButton" onclick="copyBase64()">Copy</button>
    </div>

    <!-- DECODE -->
    <div class="card">
        <h2>Decode</h2>
        <textarea id="base64Input" placeholder="Paste Base64 Data URL..."></textarea>
        <button onclick="decodeBase64()">Decode & Preview</button>
        <div id="preview"></div>
    </div>

    <!-- CACHE -->
    <div class="card">
        <h2>Cache</h2>
        <button class="danger small" onclick="clearCache()">Clear All</button>
        <div id="cacheList"></div>
    </div>

</div>

<script>
const CACHE_KEY = "base64_cache_v1";
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const base64Output = document.getElementById("base64Output");

// Drag & drop
dropZone.onclick = () => fileInput.click();

dropZone.ondragover = e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
};

dropZone.ondragleave = () => dropZone.classList.remove("dragover");

dropZone.ondrop = e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
};

fileInput.onchange = () => handleFile(fileInput.files[0]);

function handleFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
        base64Output.value = reader.result;
        saveToCache(file, reader.result);
        renderCache();
    };
    reader.readAsDataURL(file);
}

function saveToCache(file, dataUrl) {
    const cache = loadCache();
    cache.unshift({
        id: crypto.randomUUID(),
        name: file.name,
        type: file.type,
        size: file.size,
        time: new Date().toISOString(),
        data: dataUrl
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache.slice(0, 20)));
}

function loadCache() {
    return JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
}

function renderCache() {
    const list = document.getElementById("cacheList");
    const cache = loadCache();
    list.innerHTML = "";

    if (!cache.length) {
        list.innerHTML = "<small>No cached items</small>";
        return;
    }

    cache.forEach(item => {
        const div = document.createElement("div");
        div.className = "cache-item";

        div.innerHTML = `
            <strong>${item.name}</strong>
            <div class="cache-meta">
                ${item.type} • ${(item.size / 1024).toFixed(1)} KB
            </div>
            <button class="small" onclick="loadCacheItem('${item.id}')">Load</button>
            <button class="small danger" onclick="deleteCacheItem('${item.id}')">Delete</button>
        `;
        list.appendChild(div);
    });
}

function loadCacheItem(id) {
    const item = loadCache().find(i => i.id === id);
    if (!item) return;
    base64Output.value = item.data;
    document.getElementById("base64Input").value = item.data;
    decodeBase64();
}

function deleteCacheItem(id) {
    const cache = loadCache().filter(i => i.id !== id);
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    renderCache();
}

function clearCache() {
    if (confirm("Clear all cached items?")) {
        localStorage.removeItem(CACHE_KEY);
        renderCache();
    }
}

function copyBase64() {
    if (base64Output.value) {
        navigator.clipboard.writeText(base64Output.value);
        document.getElementById("copyButton").innerText = "Copied!";
        setTimeout(() => {
            document.getElementById("copyButton").innerText = "Copy";
        }, 2000);
    }

}

function decodeBase64() {
    const input = document.getElementById("base64Input").value.trim();
    const preview = document.getElementById("preview");
    preview.innerHTML = "";

    if (!input.startsWith("data:")) return;

    const mime = input.substring(input.indexOf(":") + 1, input.indexOf(";"));

    if (mime.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = input;
        preview.appendChild(img);
    } else if (mime === "application/pdf") {
        const iframe = document.createElement("iframe");
        iframe.src = input;
        preview.appendChild(iframe);
    }
}

renderCache();
</script>

</body>
</html>
